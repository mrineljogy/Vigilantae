# Copy to .streamlit/secrets.toml locally. Do not commit the real file.
# Paste the real values in the Streamlit deployment's Secrets settings.

# Managed PostgreSQL connection for shared, persistent case records.
DATABASE_URL = "postgresql+psycopg://USER:PASSWORD@HOST:5432/DATABASE?sslmode=require"

# Optional match-alert email account. Use an app password, never your mailbox password.
SMTP_HOST = "smtp.example.com"
SMTP_PORT = "587"
SMTP_USER = "operations@example.com"
SMTP_PASSWORD = "replace-with-app-password"
NOTIFY_EMAIL = "operations@example.com"

# Required only for a deployed officer/admin portal. Use your real bcrypt hash,
# not your plain-text password. Keep this entire file private.
[auth.credentials.usernames.admin]
email = "you@example.com"
name = "Your Name"
city = "Your City"
area = "Your Jurisdiction"
role = "Admin"
password = "$2b$12$replace-with-your-bcrypt-password-hash"

[auth.cookie]
expiry_days = 1
key = "replace-with-a-long-random-secret"
name = "vigilantae_session"

[auth.preauthorized]
emails = ["you@example.com"]
