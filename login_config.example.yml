# Copy this file to login_config.yml when starting from a clean checkout.
# Generate password hashes with bcrypt; never store plain-text passwords here.
credentials:
  usernames:
    admin:
      email: you@example.com
      name: Your Name
      city: Your City
      area: Your Jurisdiction
      role: Admin
      password: '$2b$12$replace-with-your-bcrypt-password-hash'
cookie:
  expiry_days: 1
  key: replace-with-a-long-random-secret
  name: vigilantae_session
preauthorized:
  emails:
  - you@example.com
